[configs]
; 呼出武器轮盘的主按键（ASCII 码或虚拟键码，81 对应 'Q' 键）
PrimaryKey=81

; 备用呼出按键（设为 0 表示禁用）
SecondaryKey=0

; 是否开启子弹时间/慢动作（1 = 开启，0 = 关闭）
EnableSlowMotion=1

; 慢动作时的游戏时间流速（取值范围 0.01 ~ 1.0，0.15 即正常速度的 15%）
SlowMotionSpeed=0.15

; 鼠标上下滑动方向是否反转（1 = 反转，0 = 正常）
InvertMouseVertical=0

; 是否跳过没有武器的空槽位（1 = 跳过，0 = 显示所有 10 个槽位）
SkipEmptySlots=1

; 载具内是否允许呼出轮盘（1 = 允许，0 = 禁止）
AllowInVehicle=0

; 是否在轮盘中心显示当前选中武器的剩余弹药（1 = 显示，0 = 隐藏）
ShowAmmo=1

; 是否在轮盘中心显示当前选中武器的名称（1 = 显示，0 = 隐藏）
ShowWeaponName=1

; 是否禁用游戏原版的滚轮/按键切枪功能（1 = 禁用，0 = 保留原版切枪）
DisableVanillaCycle=1

; 轮盘外圈半径（决定轮盘整体大小，默认 280.0）
WheelRadius=280.0

; 轮盘内圈半径（中间镂空区域大小，默认 110.0）
WheelInnerRadius=110.0

; 鼠标选择盲区死区（像素单位，鼠标在该距离内时保持当前选中的槽位）
SelectDeadzone=30.0

