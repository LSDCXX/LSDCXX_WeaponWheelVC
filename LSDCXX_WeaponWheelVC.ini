[configs]
; Key held to open the wheel (VK code). 9 = Tab, 81 = Q
; 按住打开轮盘的按键（虚拟键码）。9 = Tab，81 = Q
PrimaryKey=9

; Alternate key (0 = disabled)
; 备用按键（0 = 禁用）
SecondaryKey=0

; Slow the game while the wheel is open (1 = enabled, 0 = disabled)
; 打开轮盘时开启慢动作/子弹时间（1 = 开启，0 = 关闭）
EnableSlowMotion=1

; Time scale while wheel is open (0.01 ~ 1.0)
; 打开轮盘时的时间流速缩放（0.01 ~ 1.0）
SlowMotionSpeed=0.15

; Invert mouse vertical axis for wheel selection (1 = invert, 0 = normal)
; 轮盘选择时反转鼠标 Y 轴（1 = 反转，0 = 正常）
InvertMouseVertical=0

; Only show weapon slots that currently contain weapons (1 = recommended, 0 = show all 10 slots)
; 仅显示当前持有武器的槽位（1 = 推荐开启，0 = 显示全部10个槽位）
SkipEmptySlots=0

; Allow opening the wheel while driving a vehicle (1 = allowed, 0 = blocked)
; 允许在驾驶载具时呼出轮盘（1 = 允许，0 = 禁止）
AllowInVehicle=0

; Show remaining ammo count in the wheel center (1 = show, 0 = hide)
; 在轮盘中心显示剩余弹药数量（1 = 显示，0 = 隐藏）
ShowAmmo=1

; Show weapon name in the wheel center (1 = show, 0 = hide)
; 在轮盘中心显示当前武器名称（1 = 显示，0 = 隐藏）
ShowWeaponName=1

; Enable background blur / frosted overlay while the wheel is open (1 = enabled, 0 = disabled)
; 打开轮盘时启用背景磨砂虚化层（1 = 启用，0 = 关闭）
EnableBackgroundBlur=1

; Outer wheel radius in base 640x480 screen coordinates
; 轮盘外圈半径（基于 640x480 参考坐标）
WheelRadius=280.0

; Inner cutout hole radius
; 轮盘中心镂空圆孔半径
WheelInnerRadius=110.0

; Aim deadzone distance from center before changing selection
; 相对轮盘中心的鼠标选择死区距离
SelectDeadzone=30.0

; Weapon icon size multiplier (0.3 ~ 3.0, 1.0 = default)
; 武器图标尺寸缩放倍率（0.3 ~ 3.0，1.0 = 默认）
IconScale=0.8

